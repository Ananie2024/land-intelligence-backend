# -----------------------------------------------------------------------------
# Land Intelligence frontend — nginx server config
#   * Serves the Vite/React static bundle from /usr/share/nginx/html
#   * SPA fallback: unknown routes return index.html (client-side routing)
#   * Proxies /api and /health requests to the backend `api` service
# -----------------------------------------------------------------------------

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for faster delivery of static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               image/svg+xml;
    gzip_min_length 1024;

    # Cache hashed static assets aggressively (Vite emits content-hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API and health endpoints to the backend service
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # SPA fallback — let the router handle unknown paths
    location / {
        try_files $uri $uri/ /index.html;
    }
}
