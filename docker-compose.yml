# =============================================================================
# Land Intelligence & Stewardship System — Full Deployment Stack
# -----------------------------------------------------------------------------
# Orchestrates the complete backend + supporting services + frontend.
#
# Services:
#   db             PostgreSQL 16 + PostGIS (persistent)
#   redis          Redis 7 (Celery broker/backend + token blacklist)
#   api            FastAPI application (Uvicorn)
#   celery-worker  Celery worker
#   celery-beat    Celery beat (schedules backups / integrity checks)
#   web            Vite/React frontend served by nginx (optional)
#
# Usage:
#   docker compose up -d --build
#   docker compose logs -f api
# =============================================================================

name: land-intelligence

services:
  # ---------------------------------------------------------------------------
  # Database — PostgreSQL with PostGIS for spatial/GIS features
  # ---------------------------------------------------------------------------
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-land_intelligence_db}
      POSTGRES_USER: ${DATABASE_USER:-land_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-land_user} -d ${DATABASE_NAME:-land_intelligence_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # Redis — Celery broker/backend and JWT token blacklist
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # API — FastAPI served by Uvicorn
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: land-intelligence-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      # Override Windows-oriented storage paths with container-relative ones.
      FILE_STORAGE_PATH: /app/file-storage
      BACKUP_BASE_PATH: /app/backups
      LOG_FILE_PATH: /app/logs/app.log
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers ${UVICORN_WORKERS:-4}
    volumes:
      - file-storage:/app/file-storage
      - backups:/app/backups
      - logs:/app/logs
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - backend


  # ---------------------------------------------------------------------------
  # Celery worker — executes background tasks
  # ---------------------------------------------------------------------------
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: land-intelligence-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      FILE_STORAGE_PATH: /app/file-storage
      BACKUP_BASE_PATH: /app/backups
      LOG_FILE_PATH: /app/logs/celery-worker.log
      # The API container owns migrations; workers must not race it on a
      # fresh database (SET via entrypoint RUN_MIGRATIONS gate).
      RUN_MIGRATIONS: "false"
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - file-storage:/app/file-storage
      - backups:/app/backups
      - logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # Celery beat — schedules periodic jobs (backups, integrity checks, retries)
  # ---------------------------------------------------------------------------
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    image: land-intelligence-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      DATABASE_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      FILE_STORAGE_PATH: /app/file-storage
      BACKUP_BASE_PATH: /app/backups
      LOG_FILE_PATH: /app/logs/celery-beat.log
      # The API container owns migrations; beat must not race it.
      RUN_MIGRATIONS: "false"
    command: celery -A app.tasks.celery_app beat --loglevel=info
    volumes:
      - backups:/app/backups
      - logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # Frontend — Vite/React app served by nginx (optional but recommended)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./land-intelligence-frontend
      dockerfile: Dockerfile
    image: land-intelligence-frontend:latest
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
    networks:
      - backend

volumes:
  pgdata:
  redisdata:
  file-storage:
  backups:
  logs:

networks:
  backend:
    driver: bridge
